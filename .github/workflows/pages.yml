name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='images/originals-camera' \
            --exclude='images/mobile-charging-cart-alt.jpg' \
            --exclude='images/mobile-charging-cart-polished.png' \
            --exclude='images/skid-dimensional.png' \
            --exclude='images/spider-box-polished.png' \
            ./ site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
