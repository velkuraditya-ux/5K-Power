# Azure Pipelines — 5K Power (Static Web Apps)
# Place this at the repo root in Azure DevOps.
# Replace $(AZURE_STATIC_WEB_APPS_API_TOKEN) with a pipeline secret from your Static Web App.

trigger:
  - main

pool:
  vmImage: ubuntu-latest

jobs:
  - job: build_and_deploy
    displayName: Deploy 5K Power static site
    steps:
      - checkout: self
        submodules: true

      - task: AzureStaticWebApp@0
        inputs:
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
